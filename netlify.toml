[build]
  publish = "dist"
  command = "npx playwright install chromium && npm run build"

[build.environment]
  # Installe Chromium dans node_modules (que Netlify met en cache) plutôt que dans
  # ~/.cache/ms-playwright, qui serait retéléchargé à chaque build.
  PLAYWRIGHT_BROWSERS_PATH = "0"

# Old site gone: /legacy → home (301)
[[redirects]]
  from = "/legacy/*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/legacy"
  to = "/"
  status = 301
  force = true

# Legacy URL redirects (SEO-friendly 301)
[[redirects]]
  from = "/new-home/contact"
  to = "/contact"
  status = 301
  force = true
[[redirects]]
  from = "/new-home/a-propos"
  to = "/a-propos"
  status = 301
  force = true
[[redirects]]
  from = "/new-home"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/new-contact"
  to = "/contact"
  status = 301
  force = true

# Old painting service URLs → canonical
[[redirects]]
  from = "/services/new-peinture-interieure/*"
  to = "/services/peinture-interieure/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-interieure"
  to = "/services/peinture-interieure"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-exterieure/*"
  to = "/services/peinture-exterieure/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-exterieure"
  to = "/services/peinture-exterieure"
  status = 301
  force = true

# SPA fallback for unknown routes (admin, 404).
# Do NOT use force=true: Netlify must serve prerendered /path/index.html first
# so crawlers get real HTML, not the home SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200