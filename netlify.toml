[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/legacy/*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/legacy"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/new-home/contact"
  to = "/contact"
  status = 301
  force = true
[[redirects]]
  from = "/new-home/a-propos"
  to = "/a-propos"
  status = 301
  force = true
[[redirects]]
  from = "/new-home"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/new-contact"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/services/new-peinture-interieure/*"
  to = "/services/peinture-interieure/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-interieure"
  to = "/services/peinture-interieure"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-exterieure/*"
  to = "/services/peinture-exterieure/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-exterieure"
  to = "/services/peinture-exterieure"
  status = 301
  force = true
