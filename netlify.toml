[build]
  publish = "dist"
  command = "npx playwright install chromium && npm run build"

[build.environment]
  # Installe Chromium dans node_modules (que Netlify met en cache) plutôt que dans
  # ~/.cache/ms-playwright, qui serait retéléchargé à chaque build.
  PLAYWRIGHT_BROWSERS_PATH = "0"

[[redirects]]
  from = "https://www.leleverdupinceau.ca/*"
  to = "https://leleverdupinceau.ca/:splat"
  status = 301
  force = true
[[redirects]]
  from = "http://www.leleverdupinceau.ca/*"
  to = "https://leleverdupinceau.ca/:splat"
  status = 301
  force = true

# Old site gone: /legacy → home (301)
[[redirects]]
  from = "/legacy/*"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/legacy"
  to = "/"
  status = 301
  force = true

# Legacy URL redirects (SEO-friendly 301)
[[redirects]]
  from = "/new-home/contact"
  to = "/contact"
  status = 301
  force = true
[[redirects]]
  from = "/new-home/a-propos"
  to = "/a-propos"
  status = 301
  force = true
[[redirects]]
  from = "/new-home"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/new-contact"
  to = "/contact"
  status = 301
  force = true

# Old painting service URLs → canonical
[[redirects]]
  from = "/services/new-peinture-interieure/*"
  to = "/services/peinture-interieure/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-interieure"
  to = "/services/peinture-interieure"
  status = 301
  force = true
[[redirects]]
  from = "/peinture-interieure-montreal"
  to = "/services/peinture-interieure"
  status = 301
  force = true
[[redirects]]
  from = "/peinture-exterieure-montreal"
  to = "/services/peinture-exterieure"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-exterieure/*"
  to = "/services/peinture-exterieure/:splat"
  status = 301
  force = true
[[redirects]]
  from = "/services/new-peinture-exterieure"
  to = "/services/peinture-exterieure"
  status = 301
  force = true

# Pages Gatineau et Rive-Sud retirées
[[redirects]]
  from = "/secteurs/gatineau"
  to = "/secteurs"
  status = 301
  force = true
[[redirects]]
  from = "/secteurs/rive-sud"
  to = "/secteurs"
  status = 301
  force = true
[[redirects]]
  from = "/fr/peintre-gatineau"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/en/painter-gatineau"
  to = "/"
  status = 301
  force = true

# Le repli (admin -> app-shell.html, URL inconnue -> 404.html en 404) est écrit
# dans dist/_redirects par scripts/prerender.mjs. Pas de catch-all ici : servir
# index.html (l'accueil pré-rendu) en 200 crée des duplicatas de l'accueil.